name: Sync roster from Google Sheet

on:
  schedule:
    # Three times a day, on the hour. Cron here is UTC.
    - cron: "0 5,11,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull the sheets
        run: npm run sync

      - name: Commit if the roster changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then diff the index. `git diff` alone cannot see an
          # untracked file, which is exactly the case on the very first sync
          # and every time a new screenshot is downloaded.
          git add data/sheet-data.json public/screenshots
          if git diff --cached --quiet -- data/sheet-data.json public/screenshots; then
            echo "No roster change."
            exit 0
          fi
          git commit -m "Update app roster from the sheet"
          git push
          echo "Roster updated — the deploy workflow will publish it."
