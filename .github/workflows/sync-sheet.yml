name: Sync roster from Google Sheet

on:
  # Run by hand from the Actions tab. There is deliberately no schedule: the
  # sheet changes rarely, and an unattended job that can fail quietly is worse
  # than pressing a button when you actually want the site updated.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull the sheets
        run: npm run sync

      - name: Commit if the roster changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add errors on a path that does not exist, and this one only
          # appears once a screenshot has been downloaded.
          mkdir -p public/screenshots
          # Stage first, then diff the index. `git diff` alone cannot see an
          # untracked file, which is exactly the case on the very first sync
          # and every time a new screenshot is downloaded.
          git add data/sheet-data.json public/screenshots
          if git diff --cached --quiet -- data/sheet-data.json public/screenshots; then
            echo "No roster change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update app roster from the sheet"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Roster updated — publishing."

  # Invoked directly rather than left to the push above: a commit pushed with
  # the default GITHUB_TOKEN does not start a workflow run, so the roster
  # would otherwise land in the repo and never reach the site.
  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
