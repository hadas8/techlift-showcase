name: Sync roster from Google Sheet

on:
  schedule:
    # Three times a day, on the hour. Cron here is UTC.
    - cron: "0 5,11,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull the sheet
        run: npm run sync
        env:
          # Optional override, so the url can live in repo settings instead of
          # in the committed config. Settings → Secrets and variables →
          # Actions → Variables.
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}

      - name: Commit if the roster changed
        run: |
          if git diff --quiet -- data/apps.json; then
            echo "No roster change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apps.json
          git commit -m "Update app roster from the sheet"
          git push
          echo "Roster updated — the deploy workflow will publish it."
