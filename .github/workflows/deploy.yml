name: Build and deploy showcase

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable by the sync workflow. A push made with the default GITHUB_TOKEN
  # does not trigger workflows — GitHub blocks that to prevent loops — so the
  # sync has to invoke this itself rather than relying on its own commit.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch tip, not the commit that started the run.
      # actions/checkout defaults to github.sha, which for a sync-triggered
      # publish is the commit from *before* the sync wrote the roster — so the
      # deploy would faithfully build the previous version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build pages
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
